<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to checkout — Medical Bill Dispute Pro</title>
    <link rel="canonical" href="https://medicalbilldisputepro.com/payment.html">
    <link rel="stylesheet" href="/mobile-nav.css">
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav class="site-nav" style="background:#1e293b; padding:1rem; display:flex; justify-content:space-between; border-bottom:2px solid #334155; align-items:center;">
        <div class="site-nav-brand" style="color:#f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <button type="button" class="site-nav-toggle" aria-expanded="false" aria-controls="site-nav-menu" aria-label="Toggle navigation">☰</button>
        <div id="site-nav-menu" class="site-nav-links">
            <a href="/" style="color:#f5f5f5; text-decoration:none; margin:0 10px; padding:8px 12px; border-radius:4px;">Home</a>
            <a href="/upload.html" style="color:#f5f5f5; text-decoration:none; margin:0 10px; padding:8px 12px; border-radius:4px;">Upload</a>
            <a href="/pricing.html" style="color:#f5f5f5; text-decoration:none; margin:0 10px; padding:8px 12px; border-radius:4px;">Pricing</a>
        </div>
    </nav>

    <main style="width:min(560px, 92%); margin:4rem auto; text-align:center; padding:0 1rem;">
        <p id="payment-status" style="color:#cbd5e1; font-size:1.05rem;">Redirecting to secure checkout…</p>
        <p id="payment-error" style="display:none; color:#fca5a5; margin-top:1rem;"></p>
        <button id="payment-retry" type="button" style="display:none; margin-top:1rem; background:#22c55e; color:#fff; border:none; border-radius:8px; padding:12px 20px; font-weight:600; cursor:pointer;">Try again</button>
    </main>

    <script type="module">
      import './src/main.js';
      import './src/mobile-nav.js';

      async function startPaymentCheckout() {
        const status = document.getElementById('payment-status');
        const errEl = document.getElementById('payment-error');
        const retry = document.getElementById('payment-retry');
        if (status) status.textContent = 'Redirecting to secure checkout…';
        if (errEl) errEl.style.display = 'none';
        if (retry) retry.style.display = 'none';

        try {
          await window.startCheckout('single');
        } catch (e) {
          if (status) status.textContent = 'Could not start checkout.';
          if (errEl) {
            errEl.style.display = 'block';
            errEl.textContent = e.message || 'Checkout failed.';
          }
          if (retry) retry.style.display = 'inline-block';
        }
      }

      document.getElementById('payment-retry')?.addEventListener('click', startPaymentCheckout);
      startPaymentCheckout();
    </script>
</body>
</html>
