<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/mobile-nav.css">
    <title>Your Dashboard | Medical Bill Dispute Pro</title>
    <meta name="description" content="Access your Medical Bill Dispute Pro dashboard to view your dispute letters and account information.">
    <link rel="canonical" href="https://medicalbillingdisputehelp.ai/dashboard.html">
    <meta property="og:title" content="Your Dashboard | Medical Bill Dispute Pro">
    <meta property="og:description" content="Access your Medical Bill Dispute Pro dashboard to view your dispute letters and account information.">
    <meta property="og:image" content="https://medicalbillingdisputehelp.ai/images/og-image.jpg">
    <meta property="og:url" content="https://medicalbillingdisputehelp.ai/dashboard.html">
    <meta property="og:type" content="website">
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav class="site-nav" style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; border-bottom: 2px solid #334155; align-items:center;">
        <div class="site-nav-brand" style="color: #f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <button type="button" class="site-nav-toggle" aria-expanded="false" aria-controls="site-nav-menu" aria-label="Toggle navigation">☰</button>
        <div id="site-nav-menu" class="site-nav-links">
            <a href="/" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Home</a>
            <a href="/login.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Login</a>
            <a href="/terms.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Terms</a>
        </div>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:2rem;">
            <h1 style="color:#ffffff; font-size:2.5rem; margin:0;">Your Dashboard</h1>
            <a href="/upload.html" style="display:inline-block; background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color:#ffffff; padding:0.85rem 1.5rem; border-radius:10px; font-size:1rem; font-weight:700; text-decoration:none; box-shadow:0 8px 24px rgba(34,197,94,0.35);">Dispute Another Bill →</a>
        </div>

        <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:2rem; margin-bottom:2rem;">
            <h2 style="color:#ffffff; font-size:1.5rem; margin:0 0 1.25rem;">Your Letters</h2>
            <div id="recentLetters">
                <p style="color:#94a3b8;">Loading letters…</p>
            </div>
        </div>

        <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:2rem;">
            <h2 style="color:#ffffff; font-size:1.5rem; margin:0 0 1.25rem;">Account</h2>
            <div id="accountStatus" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1rem 2rem;">
                <p style="color:#ffffff; margin:0;"><strong>Email:</strong><br><span id="account-email" style="color:#94a3b8;">—</span></p>
                <p style="color:#ffffff; margin:0;"><strong>Member since:</strong><br><span id="account-member-since" style="color:#94a3b8;">—</span></p>
                <p style="color:#ffffff; margin:0;"><strong>Letters created:</strong><br><span id="account-letters-count" style="color:#94a3b8;">—</span></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { getUserMedicalBillJobs } from './src/components/UploadForm.js';
        import { getCurrentUser } from './src/components/Auth.js';

        function showToast(message) {
            const el = document.createElement('div');
            el.textContent = message;
            el.setAttribute('role', 'status');
            el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:9999;font-size:0.95rem;max-width:min(92vw,480px);text-align:center;';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }

        function truncateProvider(name) {
            const t = String(name || '').trim();
            if (!t) return 'Medical provider';
            return t.length > 40 ? t.slice(0, 40) + '…' : t;
        }

        function providerFromJob(row) {
            const wizard = row.wizard_json;
            if (wizard && typeof wizard === 'object' && wizard.providerName) {
                return truncateProvider(wizard.providerName);
            }
            const letter = row.letter_full || '';
            const reMatch = letter.match(/^Re:\s*(.+)$/im);
            if (reMatch && reMatch[1].trim()) {
                return truncateProvider(reMatch[1]);
            }
            const firstLine = letter.split('\n').map((l) => l.trim()).find(Boolean);
            if (firstLine && firstLine.length > 3) {
                return truncateProvider(firstLine);
            }
            return 'Medical provider';
        }

        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const toast = sessionStorage.getItem('dashboard_toast');
                if (toast) {
                    sessionStorage.removeItem('dashboard_toast');
                    showToast(toast);
                }
            } catch (_) {}

            currentUser = await getCurrentUser();

            if (!currentUser) {
                window.location.href = '/login?redirect=' + encodeURIComponent('/dashboard');
                return;
            }

            document.getElementById('account-email').textContent = currentUser.email || '—';
            document.getElementById('account-member-since').textContent =
                currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString() : '—';

            await loadUserData(currentUser);
        });

        async function loadUserData(user) {
            try {
                const appeals = await getUserMedicalBillJobs(user.id);
                document.getElementById('account-letters-count').textContent = String(appeals.length);
                displayRecentAppeals(appeals);
            } catch (error) {
                console.error('Failed to load user data:', error);
                document.getElementById('recentLetters').innerHTML = '<p style="color:#94a3b8;">Failed to load letters</p>';
            }
        }

        function displayRecentAppeals(appeals) {
            const container = document.getElementById('recentLetters');

            if (!appeals || appeals.length === 0) {
                container.innerHTML = `
                <div style="text-align:center; padding:2rem;">
                  <div style="font-size:3rem; margin-bottom:1rem;" aria-hidden="true">📄</div>
                  <p style="color:#94a3b8; margin-bottom:1.5rem;">No dispute letters yet.</p>
                  <a href="/upload.html" style="background:#22c55e; color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Dispute Your First Bill</a>
                </div>`;
                return;
            }

            container.replaceChildren();
            appeals.forEach((rowData) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; border:1px solid #334155; padding:1rem 1.25rem; margin:0.5rem 0; border-radius:8px; background:#0f172a;';

                const meta = document.createElement('div');
                meta.style.color = '#ffffff';
                const dateStr = rowData.created_at ? new Date(rowData.created_at).toLocaleDateString() : '—';
                const provider = providerFromJob(rowData);
                meta.textContent = dateStr + '  |  ' + provider;

                const link = document.createElement('a');
                link.href = '/preview/' + encodeURIComponent(rowData.id);
                link.textContent = 'View Letter →';
                link.style.cssText = 'color:#22c55e; font-weight:600; text-decoration:none; white-space:nowrap;';

                row.appendChild(meta);
                row.appendChild(link);
                container.appendChild(row);
            });
        }
    </script>
    <script type="module" src="/src/mobile-nav.js"></script>

    <footer style="padding:28px 0; background:#0b1220; color:#cbd5e1; text-align:center; margin-top:60px;">
        <div style="width:min(1120px, 92%); margin-inline:auto;">
            <p>&copy; 2026 Medical Bill Dispute Pro. <a href="/privacy.html" style="color:#93c5fd; text-decoration:none;">Privacy</a> | <a href="/terms.html" style="color:#93c5fd; text-decoration:none;">Terms</a> | <a href="/disclaimer.html" style="color:#93c5fd; text-decoration:none;">Disclaimer</a></p>
        </div>
    </footer>
</body>
</html>
