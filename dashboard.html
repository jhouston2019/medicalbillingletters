<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Access your Medical Bill Dispute Pro dashboard to view your claim letter analyses, response letters, and account information.">

    <meta property="og:description" content="Access your Medical Bill Dispute Pro dashboard to view your claim letter analyses, response letters, and account information.">

</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; border-bottom: 2px solid #334155;">
        <div style="color: #f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <div>
            <a href="/" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Home</a> |
            <a href="/examples.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Examples</a> |
            <a href="/pricing.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Pricing</a> |
            <a href="/login.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Login</a> |
            <a href="/terms.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Terms</a>
        </div>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <h1 style="color:#ffffff; font-size:2.5rem; margin-bottom:2rem;">Your Dashboard</h1>
        
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:2rem; margin:2rem 0;">
            <div style="background:#1e293b; padding:2rem; border-radius:12px; color:#ffffff; border:1px solid #334155;">
                <h3 style="color:#ffffff; font-size:1.5rem; margin-bottom:1rem;">Recent Letters</h3>
                <div id="recentLetters">
                    <p style="color:#94a3b8;">Loading your letters...</p>
                </div>
                <a href="/upload.html" style="background:#334155; color:white; padding:14px 28px; border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; font-size:1rem; font-weight:600; text-decoration:none; display:inline-block; margin-top:1rem; border:1px solid #475569;">New dispute wizard</a>
            </div>
            
            <div style="background:#1e293b; padding:2rem; border-radius:12px; color:#ffffff; border:1px solid #334155;">
                <h3 style="color:#ffffff; font-size:1.5rem; margin-bottom:1rem;">Quick Actions</h3>
                <div style="display:flex; flex-direction:column; gap:1rem;">
                    <a href="/upload.html" style="background:#334155; color:white; padding:14px 28px; border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; font-size:1rem; font-weight:600; text-decoration:none; display:inline-block; text-align:center; border:1px solid #475569;">Open wizard</a>
                    <a href="/pricing.html" style="background:#475569; color:white; padding:14px 28px; border:none; border-radius:10px; cursor:pointer; font-family:'Inter',sans-serif; font-size:1rem; font-weight:600; text-decoration:none; display:inline-block; text-align:center;">Pricing</a>
                </div>
            </div>
            
            <div style="background:#1e293b; padding:2rem; border-radius:12px; color:#ffffff; border:1px solid #334155;">
                <h3 style="color:#ffffff; font-size:1.5rem; margin-bottom:1rem;">Account Status</h3>
                <div id="accountStatus">
                    <p style="color:#94a3b8;">Loading account information...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';
        import { getUserDocuments } from './src/components/UploadForm.js';
        import { getCurrentUser } from './src/components/Auth.js';

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        );
        
        let currentUser = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await getCurrentUser();
            
            if (!currentUser) {
                alert('Please login to access your dashboard');
                window.location.href = '/login.html';
                return;
            }
            
            // Payment verification happens server-side on API calls
            // No client-side checks - all enforcement in backend
            
            await loadUserData();
        });
        
        async function loadUserData() {
            try {
                // Load user documents
                const documents = await getUserDocuments(currentUser.id);
                displayRecentLetters(documents);
                
                // Update account status
                await updateAccountStatus();
                
            } catch (error) {
                console.error('Failed to load user data:', error);
                document.getElementById('recentLetters').innerHTML = '<p style="color:#94a3b8;">Failed to load letters</p>';
            }
        }
        
        function displayRecentLetters(documents) {
            const container = document.getElementById('recentLetters');
            
            if (documents.length === 0) {
                container.innerHTML = `
                <div style="text-align:center; padding:2rem;">
                  <div style="font-size:3rem; margin-bottom:1rem;" aria-hidden="true">&#128196;</div>
                  <p style="color:#94a3b8; margin-bottom:1.5rem;">No dispute letters yet.</p>
                  <a href="/payment.html" style="background:#22c55e; color:#fff; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Dispute Your First Bill</a>
                </div>`;
                return;
            }
            
            container.replaceChildren();
            documents.slice(0, 5).forEach((doc) => {
                const row = document.createElement('div');
                row.style.cssText = 'border: 1px solid #334155; padding: 1rem; margin: 0.5rem 0; border-radius: 8px; background:#0f172a;';
                const strong = document.createElement('strong');
                strong.style.color = '#ffffff';
                strong.textContent = doc.file_name != null ? String(doc.file_name) : '';
                const br = document.createElement('br');
                const small = document.createElement('small');
                small.style.color = '#94a3b8';
                small.textContent = 'Uploaded: ' + new Date(doc.created_at).toLocaleDateString();
                row.appendChild(strong);
                row.appendChild(br);
                row.appendChild(small);
                container.appendChild(row);
            });
        }
        
        async function updateAccountStatus() {
            const statusDiv = document.getElementById('accountStatus');
            let planLabel = '\u2014';
            try {
                const { data, error } = await supabase
                    .from('claim_letters')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('payment_status', 'paid')
                    .limit(1);
                if (!error && data && data.length > 0) {
                    planLabel = 'Pro (Active)';
                } else if (!error) {
                    planLabel = 'Free';
                }
            } catch (_) {
                planLabel = '\u2014';
            }
            statusDiv.innerHTML = `
                <p style="color:#ffffff;"><strong>Email:</strong> <span style="color:#94a3b8;">${currentUser.email}</span></p>
                <p style="color:#ffffff;"><strong>Member since:</strong> <span style="color:#94a3b8;">${new Date(currentUser.created_at).toLocaleDateString()}</span></p>
                <p style="color:#ffffff;"><strong>Plan:</strong> <span style="color:#94a3b8;">${planLabel}</span></p>
            `;
        }
    </script>

    <footer style="padding:28px 0; background:#0b1220; color:#cbd5e1; text-align:center; margin-top:60px;">
        <div style="width:min(1120px, 92%); margin-inline:auto;">

        </div>
    </footer>
</body>
</html>
