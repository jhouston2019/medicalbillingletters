<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment verification — Medical Bill Dispute Pro</title>
    <link rel="canonical" href="https://medicalbilldisputepro.com/success">
</head>

<body style="background:#f8fafc; color:#0f172a; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; border-bottom:2px solid #334155; align-items:center;">
        <div style="color:#f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <div>
            <a href="/" style="color:#f5f5f5; text-decoration:none; margin:0 10px;">Home</a> |
            <a href="/pricing" style="color:#f5f5f5; text-decoration:none; margin:0 10px;">Pricing</a> |
            <a href="/terms.html" style="color:#f5f5f5; text-decoration:none; margin:0 10px;">Terms</a>
        </div>
    </nav>

    <main>
        <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
            <div style="text-align:center; padding:3rem 1.25rem 2rem; background:linear-gradient(135deg, #10b981 0%, #059669 100%); color:white; margin-bottom:2rem; border-radius:12px;">
                <span style="font-size:3rem; margin-bottom:0.75rem; display:block;">✅</span>
                <h1 id="success-page-title" style="font-size:2rem; margin-bottom:0.75rem; font-weight:700; line-height:1.2;">Checking payment…</h1>
                <p id="success-hero-sub" style="font-size:1.1rem; opacity:0.95; max-width:560px; margin:0 auto;">Please wait.</p>
            </div>

            <div id="success-main-card" style="max-width:560px; margin:0 auto; background:white; border-radius:16px; padding:2rem; box-shadow:0 20px 40px rgba(0,0,0,0.08); border:1px solid #e2e8f0; text-align:center;">
                <p id="success-status" style="margin:0; color:#475569; font-weight:500;"></p>

                <div id="success-error" style="display:none; margin-top:1.25rem; padding:1rem; background:#fee2e2; border:1px solid #fca5a5; border-radius:8px; color:#991b1b; text-align:left;">
                    <p id="success-error-msg" style="margin:0 0 0.75rem;"></p>
                    <button type="button" id="success-retry" style="padding:10px 20px; border-radius:8px; border:none; background:#991b1b; color:#fff; font-weight:600; cursor:pointer;">Retry verification</button>
                </div>

                <div style="margin-top:1.5rem;">
                    <a href="/recover" style="color:#2563eb; font-weight:600; text-decoration:none;">Need help?</a>
                </div>
            </div>
        </div>
    </main>

    <footer style="padding:28px 0; background:#0b1220; color:#cbd5e1; text-align:center; margin-top:3rem;">
        <div style="width:min(1120px, 92%); margin-inline:auto;">
            <p>&copy; 2026 Medical Bill Dispute Pro. <a href="/privacy.html" style="color:#93c5fd; text-decoration:none;">Privacy</a> | <a href="/terms.html" style="color:#93c5fd; text-decoration:none;">Terms</a></p>
        </div>
    </footer>

    <script type="module" src="/src/success-main.js"></script>
</body>
</html>
