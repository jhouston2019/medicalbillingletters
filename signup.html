<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account | Medical Bill Dispute Pro</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; display:flex; justify-content:space-between; border-bottom: 2px solid #334155;">
        <div style="color: #f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <div>
            <a href="/pricing" style="color: #f5f5f5; text-decoration: none; margin: 0 10px;">Pricing</a> |
            <a href="/login.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px;">Login</a>
        </div>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <div style="max-width:500px; margin:2rem auto; padding:2rem; background:#ffffff; border-radius:12px; color:#2d3748; border:1px solid #e2e8f0;">
            <h2 style="text-align:center; margin-bottom:2rem;">Create account</h2>
            <form id="signupForm">
                <div style="margin-bottom:1.5rem;">
                    <label for="email" style="display:block; margin-bottom:0.5rem; font-weight:bold;">Email</label>
                    <input type="email" id="email" required style="width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:10px;">
                </div>
                <div style="margin-bottom:1.5rem;">
                    <label for="password" style="display:block; margin-bottom:0.5rem; font-weight:bold;">Password</label>
                    <input type="password" id="password" required minlength="6" style="width:100%; padding:14px 16px; border:2px solid #e2e8f0; border-radius:10px;">
                </div>
                <button type="submit" style="background:#334155; color:white; padding:14px 28px; border:none; border-radius:10px; cursor:pointer; width:100%; font-weight:600;">Sign up</button>
            </form>
            <p style="text-align:center; margin-top:1rem;"><a href="/login.html" style="color:#2563eb;">Already have an account?</a></p>
        </div>
    </div>

    <script type="module">
        import { signUp } from './src/components/Auth.js';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const { error } = await signUp(email, password);
                if (error) {
                    alert('Sign up failed: ' + error.message);
                    return;
                }
                alert('Check your email to confirm your account if required, then log in.');
                window.location.href = '/login.html';
            } catch (err) {
                alert('Sign up failed: ' + err.message);
            }
        });
    </script>
</body>
</html>
