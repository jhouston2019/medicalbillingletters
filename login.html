<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Your Account | Medical Bill Dispute Pro</title>
    <meta name="description" content="Sign in or create your Medical Bill Dispute Pro account.">
    <style>
        .auth-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; }
        .auth-tab { flex: 1; padding: 0.75rem 1rem; border: none; background: transparent; color: #64748b; font-size: 1rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .auth-tab.active { color: #2d3748; border-bottom-color: #334155; }
        .auth-panel { display: none; }
        .auth-panel.active { display: block; }
        .field { margin-bottom: 1.25rem; }
        .field label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #2d3748; }
        .pw-wrap { position: relative; }
        .pw-wrap input { width: 100%; padding: 14px 44px 14px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; font-size: 0.85rem; padding: 4px; }
        .text-input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .btn-primary { background: #334155; color: white; padding: 14px 28px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; }
        .link-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 0.9rem; padding: 0; text-decoration: underline; }
    </style>
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; box-shadow:0 1px 4px rgba(0,0,0,0.1); display:flex; justify-content:space-between; border-bottom: 2px solid #334155;">
        <div style="color: #f5f5f5;"><strong>Medical Bill Dispute Pro</strong></div>
        <div>
            <a href="/upload.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Upload</a> |
            <a href="/dashboard.html" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Dashboard</a> |
            <a href="/pricing" style="color: #f5f5f5; text-decoration: none; margin: 0 10px; padding: 8px 16px; border-radius: 4px;">Pricing</a>
        </div>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <div style="max-width:500px; margin:2rem auto; padding:2rem; background:#ffffff; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.1); color:#2d3748; border:1px solid #e2e8f0;">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" data-tab="login">Log In</button>
                <button type="button" class="auth-tab" data-tab="signup">Create Account</button>
            </div>

            <div id="panel-login" class="auth-panel active">
                <form id="login-form">
                    <div class="field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" class="text-input" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="login-password" required autocomplete="current-password">
                            <button type="button" class="pw-toggle" data-target="login-password" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Log In</button>
                </form>
                <p style="margin-top:1rem; text-align:center;">
                    <button type="button" id="forgot-password-btn" class="link-btn">Forgot password?</button>
                </p>
            </div>

            <div id="panel-signup" class="auth-panel">
                <form id="signup-form">
                    <div class="field">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" class="text-input" required autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="signup-password">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="signup-password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="pw-toggle" data-target="signup-password" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="signup-confirm" required autocomplete="new-password" minlength="8">
                            <button type="button" class="pw-toggle" data-target="signup-confirm" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>
            </div>

            <p id="auth-error" style="display:none; margin-top:1rem; padding:0.75rem; background:#fee2e2; color:#991b1b; border-radius:8px; text-align:center;"></p>
            <p id="auth-success" style="display:none; margin-top:1rem; padding:0.75rem; background:#dcfce7; color:#166534; border-radius:8px; text-align:center;"></p>
        </div>
    </div>

    <script type="module">
        import { signIn, signUp, resetPassword, isAuthConfigured } from './src/components/Auth.js';

        function nextParam() {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next') || params.get('redirect');
            if (!next) return null;
            try {
                const path = decodeURIComponent(next);
                if (path.startsWith('/') && !path.startsWith('//')) return path;
            } catch (_) {}
            return null;
        }

        function showError(message) {
            const el = document.getElementById('auth-error');
            const ok = document.getElementById('auth-success');
            if (ok) ok.style.display = 'none';
            if (!el) return;
            el.textContent = message;
            el.style.display = message ? 'block' : 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('auth-success');
            const err = document.getElementById('auth-error');
            if (err) err.style.display = 'none';
            if (!el) return;
            el.textContent = message;
            el.style.display = message ? 'block' : 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('panel-login').classList.toggle('active', tab === 'login');
            document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
            showError('');
            showSuccess('');
        }

        document.querySelectorAll('.auth-tab').forEach((btn) => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        document.querySelectorAll('.pw-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
            });
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'signup') {
            switchTab('signup');
        }

        if (!isAuthConfigured()) {
            showError('Login is misconfigured (missing Supabase keys). Contact support.');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');
            showSuccess('');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showError('Email and password are required.');
                return;
            }

            if (!isAuthConfigured()) {
                showError('Login is misconfigured (missing Supabase keys). Contact support.');
                return;
            }

            try {
                const { error } = await signIn(email, password);
                if (error) {
                    showError(error.message);
                    return;
                }
                window.location.href = nextParam() || '/dashboard';
            } catch (err) {
                showError(err.message || 'Login failed.');
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');
            showSuccess('');

            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm').value;

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }
            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            if (!isAuthConfigured()) {
                showError('Login is misconfigured (missing Supabase keys). Contact support.');
                return;
            }

            try {
                const { data, error } = await signUp(email, password);
                if (error) {
                    showError(error.message);
                    return;
                }
                if (data.user && !data.session) {
                    showSuccess('Check your email to confirm your account, then log in.');
                } else {
                    window.location.href = nextParam() || '/dashboard';
                }
            } catch (err) {
                showError(err.message || 'Sign up failed.');
            }
        });

        document.getElementById('forgot-password-btn').addEventListener('click', async () => {
            showError('');
            showSuccess('');

            const email = document.getElementById('login-email').value.trim();
            if (!email) {
                showError('Enter your email above, then click Forgot password.');
                return;
            }

            try {
                const { error } = await resetPassword(email);
                if (error) {
                    showError(error.message);
                    return;
                }
                showSuccess('Password reset email sent. Check your inbox.');
            } catch (err) {
                showError(err.message || 'Could not send reset email.');
            }
        });
    </script>

    <footer style="padding:28px 0; background:#0b1220; color:#cbd5e1; text-align:center; margin-top:60px;">
        <div style="width:min(1120px, 92%); margin-inline:auto;">
            <p>&copy; 2026 Medical Bill Dispute Pro. <a href="/privacy.html" style="color:#93c5fd;">Privacy</a> | <a href="/terms.html" style="color:#93c5fd;">Terms</a></p>
        </div>
    </footer>
</body>
</html>
