<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your New Password | Medical Bill Dispute Pro</title>
    <style>
        .field { margin-bottom: 1.25rem; }
        .field label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #2d3748; }
        .text-input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .btn-primary { background: #334155; color: white; padding: 14px 28px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; }
    </style>
</head>
<body style="background:#0f172a; color:#ffffff; font-family:'Inter',sans-serif; margin:0; padding:0; line-height:1.5;">
    <nav style="background:#1e293b; padding:1rem; border-bottom: 2px solid #334155;">
        <strong style="color:#f5f5f5;">Medical Bill Dispute Pro</strong>
    </nav>

    <div style="width:min(1120px, 92%); margin-inline:auto; padding:2rem 0;">
        <div style="max-width:500px; margin:2rem auto; padding:2rem; background:#ffffff; border-radius:12px; color:#2d3748; border:1px solid #e2e8f0;">
            <h2 style="text-align:center; margin:0 0 1.5rem; font-size:1.8rem;">Set your new password</h2>
            <form id="update-password-form">
                <div class="field">
                    <label for="password">New password</label>
                    <input type="password" id="password" class="text-input" required minlength="8" autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirm">Confirm new password</label>
                    <input type="password" id="confirm" class="text-input" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Save Password</button>
            </form>
            <p id="update-error" style="display:none; margin-top:1rem; padding:0.75rem; background:#fee2e2; color:#991b1b; border-radius:8px; text-align:center;"></p>
        </div>
    </div>

    <script type="module">
        import { getSession, updatePassword } from './src/components/Auth.js';

        function showError(message) {
            const el = document.getElementById('update-error');
            if (!el) return;
            el.textContent = message;
            el.style.display = message ? 'block' : 'none';
        }

        (async () => {
            const session = await getSession();
            if (!session) {
                window.location.href = '/login';
            }
        })();

        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showError('');

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            try {
                const { error } = await updatePassword(password);
                if (error) {
                    showError(error.message);
                    return;
                }
                window.location.href = '/dashboard';
            } catch (err) {
                showError(err.message || 'Could not update password.');
            }
        });
    </script>
</body>
</html>
